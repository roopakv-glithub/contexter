name: Windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/analyze-project/index.ts supabase/functions/enhance-prompt/index.ts

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/Release/contextforge-windows-x64.zip

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: contextforge-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ContextForge ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/windows/x64/runner/Release/moscowt.exe
            build/windows/x64/runner/Release/contextforge-windows-x64.zip
